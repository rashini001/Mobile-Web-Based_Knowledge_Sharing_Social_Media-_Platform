<!DOCTYPE html>
<html>
<head>
    <title>Career Recommendations</title>
</head>
<body>
    <h1>Your Career Recommendations</h1>
    
    <h2>Academic Performance</h2>
    <p>Total Score: {{ total_score }}</p>
    <p>Average Score: {{ average_score }}</p>
    
    <h2>Top Career Recommendations</h2>
    <ul>
    {% for career, probability in recommendations %}
        <li>{{ career }}: {{ probability }}% match</li>
    {% endfor %}
    </ul>
    
    <a href="/recommend">Try Another Prediction</a>
</body>
</html>
